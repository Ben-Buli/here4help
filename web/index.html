<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="here4help">
  <link rel="apple-touch-icon" href="icons/Icon-h4h-192.png">
  
  <!-- 允許不安全內容（開發環境） -->
  <meta http-equiv="Content-Security-Policy" content="default-src * self blob: data: gap:; style-src * self 'unsafe-inline' blob: data: gap:; script-src * 'self' 'unsafe-eval' 'unsafe-inline' blob: data: gap:; object-src * 'self' blob: data: gap:; img-src * self 'unsafe-inline' blob: data: gap:; connect-src self * 'unsafe-inline' blob: data: gap:; frame-src * self blob: data: gap:;">
  
  <!-- 允許混合內容 -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon-192.png"/>

  <title>here4help</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google OAuth 2.0 JavaScript SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Facebook JavaScript SDK -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
  
  <!-- Apple Sign-In JavaScript SDK -->
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
</head>
<body>
  <!-- 環境配置注入器 -->
  <script src="js/environment_injector.js"></script>
  
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- 第三方登入初始化腳本 -->
  <script>
    // Google OAuth 2.0 初始化
    function initGoogleAuth() {
      // 從 Flutter 環境配置獲取 Client ID
      const googleClientId = window.environmentConfig?.googleClientId || '102744926949-bhrnm2970bgt3dfm2nmdbqt03mrvdh3i.apps.googleusercontent.com';
      
      if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: googleClientId,
          callback: handleGoogleCredentialResponse
        });
        console.log('✅ Google OAuth 初始化成功');
      } else {
        console.error('❌ Google SDK 未載入');
      }
    }

    function handleGoogleCredentialResponse(response) {
      // 處理 Google 登入回應
      console.log('Google 登入成功:', response);
      // 發送資料到 Flutter
      if (window.flutter_inappwebview) {
        window.flutter_inappwebview.callHandler('handleGoogleLogin', response);
      }
    }

    // Facebook SDK 初始化
    window.fbAsyncInit = function() {
      // 從 Flutter 環境配置獲取 App ID
      const facebookAppId = window.environmentConfig?.facebookAppId || 'YOUR_FACEBOOK_APP_ID';
      FB.init({
        appId: facebookAppId,
        cookie: true,
        xfbml: true,
        version: 'v18.0'
      });
    };

    function handleFacebookLogin() {
      FB.login(function(response) {
        if (response.authResponse) {
          console.log('Facebook 登入成功:', response);
          // 發送資料到 Flutter
          if (window.flutter_inappwebview) {
            window.flutter_inappwebview.callHandler('handleFacebookLogin', response);
          }
        }
      }, {scope: 'email,public_profile'});
    }

    // Apple Sign-In 初始化
    function initAppleSignIn() {
      // 從 Flutter 環境配置獲取 Service ID
      const appleServiceId = window.environmentConfig?.appleServiceId || 'YOUR_APPLE_SERVICE_ID';
      AppleID.auth.init({
        clientId: appleServiceId,
        scope: 'email name',
        redirectURI: window.location.origin + '/apple-callback',
        state: 'origin:web'
      });
    }

    function handleAppleSignIn() {
      AppleID.auth.signIn().then(function(response) {
        console.log('Apple 登入成功:', response);
        // 發送資料到 Flutter
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('handleAppleLogin', response);
        }
      }).catch(function(error) {
        console.error('Apple 登入失敗:', error);
      });
    }

    // 等待環境配置準備好後初始化第三方服務
    window.addEventListener('environmentConfigReady', function(event) {
      console.log('🎉 環境配置已準備好，開始初始化第三方登入服務');
      
      // 延遲初始化，確保 SDK 已載入
      setTimeout(function() {
        if (typeof google !== 'undefined' && window.environmentConfig?.googleClientId) {
          console.log('🔧 初始化 Google OAuth');
          initGoogleAuth();
        }
        if (typeof FB !== 'undefined' && window.environmentConfig?.facebookAppId) {
          // Facebook SDK 會在 fbAsyncInit 中自動初始化
          console.log('🔧 Facebook SDK 已準備好');
        }
        if (typeof AppleID !== 'undefined' && window.environmentConfig?.appleServiceId) {
          console.log('🔧 初始化 Apple Sign-In');
          initAppleSignIn();
        }
      }, 1000);
    });

    // 備用：頁面載入完成後也嘗試初始化（如果環境配置已準備好）
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (window.environmentConfig) {
          // 環境配置已存在，直接初始化
          window.dispatchEvent(new CustomEvent('environmentConfigReady', {
            detail: window.environmentConfig
          }));
        }
      }, 2000);
    });
  </script>
</body>
</html>
