name: here4help
description: NCCU Social Task Posting APP  - Here4help.

publish_to: 'none'

version: 1.9.5+202511091

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1   
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  geolocator: ^14.0.1
  go_router: ^13.1.0
  provider: ^6.1.0
  http: ^1.4.0
  flutter_slidable: ^3.0.0
  socket_io_client: ^3.1.2  # 更新到最新版本
  # Google 登入套件 (跨平台)
  google_sign_in: ^7.1.1
  googleapis_auth: ^1.4.1
  # Facebook 登入套件
  flutter_facebook_auth: ^7.1.2
  # Apple 登入套件
  sign_in_with_apple: ^7.0.1
  # 平台檢測
  universal_platform: ^1.0.0+1
  # URL 啟動器 (Web OAuth 支援)
  url_launcher: ^6.2.5
  # Mobile OAuth 支援
  flutter_web_auth_2: ^4.1.0
  flutter_appauth: ^10.0.0
  image_picker: ^1.0.7
  infinite_scroll_pagination: ^4.0.0
  pinput: ^3.0.1
  multi_select_flutter: ^4.1.3
  flutter_chat_ui: ^1.6.11
  flutter_chat_types: ^3.6.2
  photo_view: ^0.14.0
  file_saver: ^0.3.1
  awesome_dialog: ^3.2.1
  device_info_plus: ^9.1.2
  package_info_plus: ^4.2.0
  # 評分機制
  flutter_rating_bar: ^4.0.1
  # 圖片壓縮和處理
  flutter_image_compress: ^2.4.0
  uuid: ^4.3.3
  flutter_dotenv: ^6.0.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1 

flutter_icons:
  android: true
  ios: true
  image_path: 'assets/icon/AppIcon.png'
  
  

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/third-party-login-icon/
    # 注意：不要將 .env 檔案打包進 assets，改用 --dart-define 方式
